site_name: CRISProg
site_description: Which perturbations in a single-cell CRISPR screen drive which gene programs, and what that means.
site_url: https://deylab999mskcc.github.io/CRISProg-web/

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    logo: material/dna
    annotation: material/plus-circle

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/cm-vignette.js

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
  - Guide:
      - How CRISProg works: guide/pipeline.md
      - Preparing your data: guide/inputs.md
      - Data check and controls: guide/controls.md
      - Configuration: guide/configuration.md
      - Outputs: guide/outputs.md
      - AI report and fact-check: guide/report.md
  - Vignette:
      - TF Perturb-seq in cardiomyocytes: vignettes/cardiomyocytes.md
      - The AI report: vignettes/cardiomyocytes-report.md
  - FAQ: faq.md
